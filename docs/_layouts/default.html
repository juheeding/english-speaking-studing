<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip" href="#content">본문으로 이동</a>
  <header>
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    <p>{{ site.description | escape }}</p>
    <nav aria-label="주 메뉴">
      <a href="{{ '/' | relative_url }}">홈</a>
      <a href="{{ '/lessons/' | relative_url }}">수업 기록</a>
      <a href="{{ '/vocabulary/' | relative_url }}">표현집</a>
      <a href="{{ '/review/' | relative_url }}">복습</a>
    </nav>
  </header>
  <main id="content">{{ content }}</main>
  <footer>오늘 배운 표현 하나를 소리 내어 말해 보세요.</footer>
</body>
</html>
